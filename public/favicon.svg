<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A50"/>
      <stop offset="0.55" stop-color="#FF6B35"/>
      <stop offset="1" stop-color="#E8480F"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  
  <g>
    <!-- compartimento grande (izquierda) -->
    <rect x="86" y="136" width="180" height="240" rx="28" fill="#FFFFFF"/>
    <!-- compartimentos pequeños (derecha) -->
    <rect x="286" y="136" width="140" height="112" rx="24" fill="#FFFFFF"/>
    <rect x="286" y="264" width="140" height="112" rx="24" fill="#FFFFFF"/>

    <!-- mancuerna dentro del compartimento grande -->
    <g fill="#F04E11">
      <rect x="118" y="248" width="116" height="16" rx="8"/>
      <rect x="104" y="232" width="18" height="48" rx="9"/>
      <rect x="230" y="232" width="18" height="48" rx="9"/>
      <rect x="128" y="218" width="26" height="76" rx="12"/>
      <rect x="198" y="218" width="26" height="76" rx="12"/>
    </g>

    <!-- tomatitos (compartimento superior derecho) -->
    <g fill="#FF6B35">
      <circle cx="330" cy="182" r="15"/>
      <circle cx="368" cy="204" r="15"/>
      <circle cx="384" cy="168" r="15"/>
    </g>

    <!-- arroz / carbohidratos (compartimento inferior derecho) -->
    <g fill="#FF6B35">
      <rect x="308" y="300" width="96" height="14" rx="7"/>
      <rect x="322" y="326" width="68" height="14" rx="7"/>
    </g>
  </g>

</svg>
